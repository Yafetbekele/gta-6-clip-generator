<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Twitch Clip Ratings</title>
<style>
:root{color-scheme:dark;font-family:Segoe UI,system-ui,sans-serif;background:#10121b;color:#eee}*{box-sizing:border-box}body{margin:0}header{padding:22px 30px;border-bottom:1px solid #303348;display:flex;justify-content:space-between;align-items:center}h1{margin:0;font-size:25px}header p{color:#a7aec5;margin:6px 0}button,select,textarea{font:inherit}button,select{background:#252a3f;border:1px solid #444c68;color:#fff;border-radius:9px;padding:10px 14px;cursor:pointer}button:hover{background:#363e59}main{display:grid;grid-template-columns:290px minmax(300px,1fr) 340px;gap:24px;padding:24px;max-width:1550px;margin:auto}aside{max-height:80vh;overflow:auto}.clip{display:block;text-align:left;width:100%;margin:8px 0}.clip.active{border-color:#b395ff;background:#342654}.clip small{display:block;color:#b8bfd2;margin-top:5px}.viewer{text-align:center}video{width:100%;max-height:76vh;background:#000;border-radius:12px}.details{background:#1a1e2d;padding:22px;border-radius:14px;align-self:start}h2{font-size:21px;overflow-wrap:anywhere}.muted{color:#a7aec5;font-size:14px}textarea{width:100%;min-height:145px;background:#101420;border:1px solid #48506a;border-radius:9px;color:white;padding:12px;margin:10px 0 18px}fieldset{border:0;padding:0;margin:22px 0}legend{margin-bottom:12px}.scores{display:flex;gap:7px}.scores label{flex:1;text-align:center;cursor:pointer}.scores input{position:absolute;opacity:0}.scores span{display:block;padding:13px 6px;background:#252a3f;border:1px solid #48506a;border-radius:8px}.scores input:checked+span{background:#7551cc;border-color:#cab3ff}.scores input:focus-visible+span{outline:2px solid white}.primary{background:#7551cc;border-color:#9977ec;width:100%;margin-bottom:10px}.secondary{width:100%}#status{min-height:40px;color:#b9e8bf;margin-top:16px}#error{color:#ffb9b9}#filter{width:100%}#filename{overflow-wrap:anywhere;font-size:12px}@media(max-width:1050px){main{grid-template-columns:220px 1fr}.details{grid-column:2}aside{grid-row:span 2}}@media(max-width:650px){main{display:block;padding:14px}aside{max-height:200px;margin-bottom:20px}.details{margin-top:20px}header{padding:18px;display:block}video{max-height:60vh}}
</style></head><body>
<header><div><h1>Twitch Clip Ratings</h1><p>Watch the moment. Tell us if it was worth clipping.</p></div><div id="progress">Loading clips...</div></header>
<main><aside><label for="filter">Show clips</label><select id="filter"><option value="all">All clips</option><option value="unrated">Not rated yet</option><option value="rated">Already rated</option></select><button id="refresh" style="width:100%;margin-top:10px">Refresh clips</button><div id="list"></div></aside>
<section class="viewer"><video id="video" controls preload="metadata"></video><p id="filename" class="muted"></p><p id="error" role="alert"></p></section>
<section class="details"><h2 id="streamer">Choose a clip</h2><p id="title" class="muted"></p><p id="hook" class="muted"></p><form id="rating"><fieldset><legend>How valuable is this clip?</legend><div class="scores">
<label><input type="radio" name="score" value="1" required><span>1</span></label><label><input type="radio" name="score" value="2"><span>2</span></label><label><input type="radio" name="score" value="3"><span>3</span></label><label><input type="radio" name="score" value="4"><span>4</span></label><label><input type="radio" name="score" value="5"><span>5</span></label>
</div><p class="muted">1 = poor &nbsp; · &nbsp; 3 = okay &nbsp; · &nbsp; 5 = excellent</p></fieldset>
<label for="notes">What made it good or bad?</label><textarea id="notes" maxlength="4000" placeholder="Funny reaction, missing context, slow start, no payoff..."></textarea><button class="primary" type="submit">Save rating</button><button class="secondary" id="next" type="button">Save & next unrated</button></form><p id="status" role="status" aria-live="polite"></p><p class="muted">Ratings save on this computer and are available for analysis in our chat. Rating a clip does not publish it.</p></section></main>
<script>
const token='__TOKEN__';let clips=[],current=null,dirty=false,saving=false,watched=0;
const $=id=>document.getElementById(id);
function filtered(){return clips.filter(c=>$('filter').value==='all'||($('filter').value==='rated'?c.score!==null:c.score===null))}
function draw(){const list=$('list');list.replaceChildren();for(const c of filtered()){const b=document.createElement('button');b.className='clip'+(current&&current.id===c.id?' active':'');b.textContent='@'+c.streamer;const small=document.createElement('small');small.textContent=c.duration+'s · '+(c.score===null?'Unrated':c.score+'/5');b.append(small);b.onclick=()=>choose(c);list.append(b)}$('progress').textContent=clips.filter(c=>c.score!==null).length+' of '+clips.length+' rated'}
function choose(c,force=false){if(saving)return;if(dirty&&!force&&!confirm('Discard unsaved rating changes?'))return;const same=current&&current.id===c.id&&current.video_version===c.video_version;current=c;dirty=false;if(!same){watched=0;$('video').src='/video/'+encodeURIComponent(c.id)+'?v='+encodeURIComponent(c.video_version||'')}$('filename').textContent=c.id+'.mp4';$('streamer').textContent='@'+c.streamer;$('title').textContent=c.title;$('hook').textContent=c.hook?.text?'Opening text: '+c.hook.text:'No opening context text';$('notes').value=c.notes||'';document.querySelectorAll('[name=score]').forEach(r=>r.checked=Number(r.value)===c.score);$('status').textContent=c.score===null?'Not rated yet.':'Saved rating: '+c.score+'/5';$('error').textContent='';draw()}
async function load(){if(saving)return;if(dirty&&!confirm('Discard unsaved rating changes?'))return;try{const r=await fetch('/api/clips');if(!r.ok)throw Error('Could not load clips');clips=await r.json().catch(()=>{throw Error('The clip list was not valid JSON')});const selected=clips.find(c=>current&&c.id===current.id)||clips.find(c=>c.score===null)||clips[0];if(selected)choose(selected,true);else{$('status').textContent='No clips yet. Refresh after clips are generated.';draw()}}catch(e){$('error').textContent=e.message}}
async function save(next){if(!current||saving)return;if(!$('rating').reportValidity())return;const c=current;const score=Number(new FormData($('rating')).get('score'));const notes=$('notes').value;saving=true;$('rating').inert=true;$('status').textContent='Saving...';try{const r=await fetch('/api/rate',{method:'POST',headers:{'Content-Type':'application/json','X-Review-Token':token},body:JSON.stringify({clip_id:c.id,score,notes,watched_seconds:Math.round(watched*10)/10})});const result=await r.json().catch(()=>({error:'Unexpected reply ('+r.status+')'}));if(!r.ok)throw Error(result.error||'Could not save');c.score=score;c.notes=notes;dirty=false;draw();$('status').textContent='Saved '+score+'/5. Available for analysis.';saving=false;if(next){const candidate=filtered().find(x=>x.score===null)||clips.find(x=>x.score===null);if(candidate)choose(candidate,true);else $('status').textContent='Saved. All clips have been rated!'}}catch(e){$('status').textContent='Not saved: '+e.message}finally{saving=false;document.getElementById('rating').inert=false}}
$('rating').onsubmit=e=>{e.preventDefault();save(false)};$('next').onclick=()=>save(true);$('rating').oninput=()=>{dirty=true;$('status').textContent='Unsaved changes'};$('filter').onchange=draw;$('video').ontimeupdate=()=>{watched=Math.max(watched,$('video').currentTime||0)};$('refresh').onclick=load;$('video').onerror=()=>{$('error').textContent='The video could not be loaded. Check that its file is still in Twitch Clips.'};window.onbeforeunload=e=>{if(dirty){e.preventDefault();e.returnValue=''}};load();
</script></body></html>
