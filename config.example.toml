[paths]
data_dir = "data"

[twitch]
game_name = "Grand Theft Auto VI"
# Use ["*"] to discover recent category archives from any streamer.
streamers = []
lookback_days = 7
clips_per_vod = 10

[highlights]
clips_per_vod = 3
duration_seconds = 35
lead_in_seconds = 4
chat_weight = 1.0
audio_weight = 1.0
twitch_clips_weight = 1.0
# Seconds chat lags behind what happened on stream. Tune it with ratings; 0 uses chat as-is.
chat_reaction_lag_seconds = 0
# Skip moments without on-screen motion. Set false for categories like Just Chatting.
require_motion = true

# Used by watch-live. A clip always spans 30 seconds before and after a burst.
[live]
warmup_seconds = 300
max_channels = 15
# A burst is chat at this multiple of the channel's rate over the last 5 minutes.
spike_multiplier = 4.0
cooldown_seconds = 900
# A burst also needs this many different chatters in those 10 seconds.
min_unique_chatters = 12
# Bot accounts whose messages are not counted. Setting this replaces the default list.
# ignored_chatters = ["nightbot", "streamelements", "moobot", "fossabot", "streamlabs"]
# Comparison windows, rendered and rated like bursts. 0 turns either one off.
# A control is a random moment, about one per channel per interval.
control_interval_seconds = 3600
# A near miss is a rise that cleared this multiple of the baseline but not spike_multiplier.
near_miss_multiplier = 2.0
near_miss_interval_seconds = 3600
# Live clips rendered at the same time, 1 to 4.
render_workers = 2

# Used by `gta-clips run` and the dashboard. Times are local, as HH:MM.
# An end earlier than the start runs past midnight, e.g. 22:00 to 02:00.
[runtime]
watch_days = ["mon", "tue", "wed", "thu", "fri", "sat", "sun"]
watch_start = "00:00"
watch_end = "24:00"
# How often each worker starts, in minutes. 0 turns it off; otherwise at least 5.
render_every_minutes = 15
ingest_every_minutes = 0
# Publishing only ever sends clips you approved.
publish_every_minutes = 0
# Copies the best new clips into data/ready-to-post/<day>/<account set>/ for posting by hand,
# up to ready_per_day per account set, spread through the day. Nothing is uploaded.
ready_every_minutes = 30
ready_per_day = 6

[editing]
renderer = "ffmpeg" # Use "remotion" after installing remotion/ dependencies. Requires layout="fit".
layout = "fit"
whisper_model = "base"

# To enable a split layout for a channel, replace "streamer_login" and
# adjust [x, y, width, height] as fractions of its source video frame.
# [editing.streamers.streamer_login]
# facecam = [0.0, 0.0, 0.25, 0.25]
# gameplay = [0.25, 0.0, 0.75, 1.0]

# A daily limit of zero disables posting to that destination.
[schedule.youtube]
daily_limit = 0
min_spacing_minutes = 120

[schedule.instagram]
daily_limit = 0
min_spacing_minutes = 120

[schedule.tiktok]
daily_limit = 0
min_spacing_minutes = 120

# Account sets: each is one YouTube + TikTok + Instagram group fed by one Twitch category.
# Sets with the same category and language share their channels, and each clip goes to the
# set with the fewest clips, so nothing is posted on two accounts. Clips are saved in
# clips/<name>/. Without any [[accounts]], twitch.game_name and live.max_channels are used.
# Connect a set's logins with: gta-clips auth youtube --account gta6-1
# [[accounts]]
# name = "gta6-1"          # lowercase letters, digits and dashes; also the folder name
# label = "GTA 6 #1"       # optional display name
# category = "Grand Theft Auto VI"
# language = "en"          # Twitch stream language; leave out for any language
# channels = 5             # live channels this set adds to the watch list (1 to 20)
