[paths]
data_dir = "data"

[twitch]
game_name = "Grand Theft Auto VI"
# Use ["*"] to discover recent category archives from any streamer.
streamers = []
lookback_days = 7
clips_per_vod = 10

[highlights]
clips_per_vod = 3
duration_seconds = 35
lead_in_seconds = 4
chat_weight = 1.0
audio_weight = 1.0
twitch_clips_weight = 1.0

# Used by watch-live. A clip always spans 30 seconds before and after a burst.
[live]
max_channels = 15
messages_per_10_seconds = 15
spike_multiplier = 3.0
cooldown_seconds = 120

[editing]
layout = "gameplay"
whisper_model = "base"

# To enable a split layout for a channel, replace "streamer_login" and
# adjust [x, y, width, height] as fractions of its source video frame.
# [editing.streamers.streamer_login]
# facecam = [0.0, 0.0, 0.25, 0.25]
# gameplay = [0.25, 0.0, 0.75, 1.0]

# A daily limit of zero disables posting to that destination.
[schedule.youtube]
daily_limit = 0
min_spacing_minutes = 120

[schedule.instagram]
daily_limit = 0
min_spacing_minutes = 120

[schedule.tiktok]
daily_limit = 0
min_spacing_minutes = 120
